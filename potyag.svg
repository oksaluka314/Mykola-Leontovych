    <g fill="#5b3a21">
      <rect x="24" y="244" width="12" height="8"/><rect x="64" y="244" width="12" height="8"/>
      <rect x="104" y="244" width="12" height="8"/><rect x="144" y="244" width="12" height="8"/>
