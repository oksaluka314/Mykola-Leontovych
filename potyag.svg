    <g fill="#e8e6e1">
      <circle cx="92" cy="92" r="14"/><circle cx="112" cy="76" r="18"/>
      <circle cx="140" cy="62" r="20"/><circle cx="172" cy="56" r="16"/>
    </g>
    <!-- табличка станції -->
    <rect x="196" y="74" width="6" height="96" fill="#7a4e2d"/>
    <rect x="168" y="70" width="104" height="32" rx="4" fill="#f8f4ea"/>
    <text x="220" y="92" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#203B60" stroke="none">ГРИШИНЕ</text>
    <!-- котел -->
    <rect x="62" y="150" width="120" height="50" rx="10" fill="#203B60"/>
    <rect x="80" y="106" width="22" height="46" fill="#2e2a26"/>
    <rect x="74" y="100" width="34" height="10" fill="#2e2a26"/>
    <path fill="#e2b13c" d="M120 150 C120 132 144 132 144 150Z"/>
