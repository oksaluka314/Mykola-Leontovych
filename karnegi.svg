    <!-- зірки / ніч -->
    <rect x="0" y="0" width="300" height="0" fill="none"/>
    <!-- будівля -->
    <rect x="40" y="96" width="220" height="150" fill="#b5533c"/>
    <rect x="34" y="86" width="232" height="12" fill="#f3e3b5"/>
    <rect x="34" y="150" width="232" height="8" fill="#f3e3b5"/>
    <rect x="40" y="70" width="220" height="16" fill="#8a3a2a"/>
    <!-- верхні вікна -->
    <g fill="#f3e3b5">
      <rect x="56" y="108" width="18" height="30"/><rect x="88" y="108" width="18" height="30"/>
      <rect x="120" y="108" width="18" height="30"/><rect x="162" y="108" width="18" height="30"/>
      <rect x="194" y="108" width="18" height="30"/><rect x="226" y="108" width="18" height="30"/>
    </g>
    <!-- арки входу -->
    <g fill="#e2b13c">
      <path d="M56 238 L56 192 C56 176 82 176 82 192 L82 238Z"/>
      <path d="M96 238 L96 192 C96 176 122 176 122 192 L122 238Z"/>
      <path d="M137 238 L137 192 C137 176 163 176 163 192 L163 238Z"/>
      <path d="M178 238 L178 192 C178 176 204 176 204 192 L204 238Z"/>
      <path d="M218 238 L218 192 C218 176 244 176 244 192 L244 238Z"/>
    </g>
    <!-- сходи -->
    <rect x="30" y="244" width="240" height="8" fill="#b9b2a6"/>
    <rect x="20" y="252" width="260" height="8" fill="#b9b2a6"/>
