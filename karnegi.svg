  <text x="150" y="61" font-family="Georgia, serif" font-size="17" text-anchor="middle" fill="#ECF3E7">5.X.1922</text>
  <!-- ноти -->
  <g fill="#8C2C56" stroke="#000" stroke-width="1.5">
    <ellipse cx="40" cy="44" rx="8" ry="6" transform="rotate(-20 40 44)"/>
    <line x1="47" y1="41" x2="47" y2="12" stroke-width="2.5"/>
    <path d="M47 12 C56 18 60 26 54 34" fill="none" stroke-width="2.5"/>
