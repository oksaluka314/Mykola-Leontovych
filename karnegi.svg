    <line x1="259" y1="37" x2="259" y2="8" stroke-width="2.5"/>
    <ellipse cx="280" cy="50" rx="8" ry="6" transform="rotate(-20 280 50)"/>
    <line x1="287" y1="47" x2="287" y2="18" stroke-width="2.5"/>
    <line x1="259" y1="8" x2="287" y2="18" stroke-width="4"/>
