<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 34 268 266" width="268" height="266">
  <!-- Будівля духовної семінарії з книгою -->
  <g stroke="#000" stroke-width="2" stroke-linejoin="round">
    <!-- земля -->
    <path fill="#5c9a3f" d="M20 236 C90 226 210 226 280 236 L280 250 L20 250Z"/>
    <!-- бічні крила -->
    <rect x="34" y="132" width="232" height="100" fill="#f3e3b5"/>
    <rect x="30" y="124" width="240" height="10" fill="#b9b2a6"/>
    <!-- центральний портик -->
    <rect x="104" y="112" width="92" height="120" fill="#f8f4ea"/>
    <path fill="#f8f4ea" d="M96 114 L150 78 L204 114Z"/>
    <circle cx="150" cy="100" r="8" fill="#bfe3f2"/>
    <!-- баня з хрестом -->
    <path fill="#3e6e2a" d="M132 80 C132 56 168 56 168 80Z"/>
    <rect x="146" y="38" width="8" height="20" fill="#e2b13c" stroke-width="1.5"/>
    <rect x="140" y="44" width="20" height="5" fill="#e2b13c" stroke-width="1.5"/>
    <!-- колони -->
    <g fill="#ffffff">
      <rect x="112" y="118" width="10" height="110"/>
      <rect x="132" y="118" width="10" height="110"/>
      <rect x="158" y="118" width="10" height="110"/>
      <rect x="178" y="118" width="10" height="110"/>
    </g>
    <!-- двері -->
    <path fill="#7a4e2d" d="M143 232 L143 196 C143 186 157 186 157 196 L157 232Z"/>
    <!-- вікна -->
    <g fill="#bfe3f2">
      <rect x="46" y="146" width="16" height="24"/><rect x="72" y="146" width="16" height="24"/>
      <rect x="46" y="190" width="16" height="24"/><rect x="72" y="190" width="16" height="24"/>
      <rect x="212" y="146" width="16" height="24"/><rect x="238" y="146" width="16" height="24"/>
      <rect x="212" y="190" width="16" height="24"/><rect x="238" y="190" width="16" height="24"/>
    </g>
    <!-- сходи -->
    <rect x="100" y="230" width="100" height="6" fill="#b9b2a6"/>
  </g>
  <!-- книга -->
  <g stroke="#000" stroke-width="2" stroke-linejoin="round">
    <path fill="#f8f4ea" d="M90 262 C110 254 136 254 150 264 C164 254 190 254 210 262 L210 290 C190 282 164 282 150 292 C136 282 110 282 90 290Z"/>
    <line x1="150" y1="264" x2="150" y2="292"/>
    <path fill="#203B60" d="M86 266 L86 294 C108 286 136 286 150 296 C164 286 192 286 214 294 L214 266 L210 266 L210 290 C190 282 164 282 150 292 C136 282 110 282 90 290 L90 266Z"/>
  </g>
  <g stroke="#8C2C56" stroke-width="1.5">
    <line x1="100" y1="266" x2="140" y2="268"/><line x1="100" y1="274" x2="140" y2="276"/>
    <line x1="160" y1="268" x2="200" y2="266"/><line x1="160" y1="276" x2="200" y2="274"/>
  </g>
</svg>
